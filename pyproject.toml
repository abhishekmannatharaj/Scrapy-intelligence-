[project]
name = "market-pulse-crawler"
version = "0.1.0"
description = "Distributed e-commerce crawling and market intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9.10",
    "motor>=3.6",
    "pymongo>=4.9",
    "celery>=5.4",
    "redis>=5.2",
    "scrapy>=2.12",
    "scrapy-playwright>=0.0.43",
    "playwright>=1.48",
    "pandas>=2.2",
    "streamlit>=1.40",
    "plotly>=5.24",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends in defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
