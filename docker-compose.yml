x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  POSTGRES_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER:-pulse}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse_change_me}
  POSTGRES_DB: ${POSTGRES_DB:-market_pulse}
  MONGO_HOST: mongo
  MONGO_USER: ${MONGO_USER:-pulse}
  MONGO_PASSWORD: ${MONGO_PASSWORD:-pulse_change_me}
  MONGO_DB: ${MONGO_DB:-market_pulse}
  REDIS_HOST: redis
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: ${RABBITMQ_USER:-pulse}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pulse_change_me}

x-deps: &deps
  postgres: {condition: service_healthy}
  mongo: {condition: service_healthy}
  redis: {condition: service_healthy}
  rabbitmq: {condition: service_healthy}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-market_pulse}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse} -d ${POSTGRES_DB:-market_pulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-pulse}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-pulse_change_me}
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pulse}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pulse_change_me}
    ports: ["15672:15672"]  # management UI
    volumes: [rabbitdata:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  api:
    build: {context: ., target: base}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: *app-env
    ports: ["8000:8000"]
    depends_on: *deps
    restart: unless-stopped

  worker:
    build: {context: ., target: worker}
    command: celery -A app.tasks.celery_app worker -Q crawl -l info --concurrency=2
    environment: *app-env
    depends_on: *deps
    shm_size: "1gb"  # Chromium
    restart: unless-stopped

  dashboard:
    build: {context: ., target: base}
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      <<: *app-env
      API_URL: http://api:8000/api/v1
    ports: ["8501:8501"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
  redisdata:
  rabbitdata:
